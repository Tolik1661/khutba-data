# Автозагрузка хутб и лекций: робот проверяет источники, скачивает новые записи
# и добавляет их в khutba.json или в черновики (drafts.json).
name: Robot — khutbas and lectures

on:
  schedule:
    # 15:47 UTC = 18:47 МСК — вечером, когда пятничная хутба уже выложена;
    # 05:17 UTC = 08:17 МСК — повтор утром. Нечётные минуты: запуски в начале часа GitHub откладывает.
    - cron: "47 15 * * *"
    - cron: "17 5 * * *"
  workflow_dispatch: {}    # ручной запуск из вкладки Actions

permissions:
  contents: write

# Один публикующий прогон за раз: иначе второй push отклоняется и результат теряется
concurrency:
  group: khutba-data-publish
  cancel-in-progress: false

jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Токен на запись не сохраняется в .git/config: сторонние пакеты его не видят,
      # он передаётся только в шаг Push
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4 (v4.4.0)
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5 (v5.6.0)
        with:
          python-version: "3.12"

      - name: Install ffmpeg and Python packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          pip install -q -r robot/requirements.txt

      # Сбой одного источника не должен отменять публикацию остальных:
      # результат коммитится, а прогон помечается упавшим в конце
      - name: Run robot
        id: robot
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ADMIN_CHAT_IDS: ${{ secrets.TG_ADMIN_CHAT_IDS }}
        run: python robot/robot.py

      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add khutba.json drafts.json robot/state.json audio
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Робот: новые записи $(date -u +%Y-%m-%d)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Пока шёл прогон, админка могла изменить khutba.json или drafts.json.
      # Без -X theirs: конфликт останавливает публикацию, а не затирает ручную правку;
      # записи будут обработаны заново в следующем прогоне
      - name: Rebase onto fresh main
        if: steps.commit.outputs.changed == 'true'
        run: |
          git pull --rebase origin main || { git rebase --abort || true; exit 1; }
          python -c "import json; json.load(open('khutba.json')); json.load(open('drafts.json'))"

      - name: Push
        if: steps.commit.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: Fail if some sources failed
        if: steps.robot.outcome == 'failure'
        run: |
          echo "::error::Часть постов или источников не обработана — подробности в шаге Run robot"
          exit 1
